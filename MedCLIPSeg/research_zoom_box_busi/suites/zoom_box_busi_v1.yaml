name: zoom_box_busi_v1
locked_at: '2026-10-06'
purpose: >-
  Evaluation-only control on breast ultrasound. On polyps (zoom_box_v1) a plain crop of twice the predicted box was not
  distinguishable from the locked window rule. The rule, however, takes its magnification from the training masks of
  each source dataset (quantile matching, target fraction 0.086 for BUSI), whereas a fixed factor has to be chosen.
  Question: does the factor that was best on polyps (2.0) transfer to ultrasound, or does the rule, which was not tuned
  on ultrasound either, do better there? Nothing is trained; the locked configuration remains the method whatever the
  outcome, and the outcome is reported whatever it is.
locked_before: >-
  Written after zoom_box_v1 (polyps) had been accepted and before any box-crop result on ultrasound existed.
lineage:
  reports/acceptance_pilot_zoom_20261005/audit.json: 8bab68fe6d7bd821844dc0f2d842b9cf9cae93c65165f5ec51871c0aca0d21b3
  reports/acceptance_test_zoom_20261005/audit.json: 8212840dbfb2057411b584af8c661a7243aca29d68fd162a098b40d5cebdad17
mc_samples: 30
batch_size: 32
threshold: 0.5
reproduction_tolerance_pp: 0.25
sources:
  formal_detail_mix_busi_v1: [666, 667, 668]
arm: detail
accepted_two_pass:            # the accepted results of the locked rule on these checkpoints; read, not recomputed
  formal_detail_mix_busi_v1: zoom_busi_v1
reference_config: tcal        # the locked rule with the quantile-matched target fraction (0.086 for BUSI)
window_rules:
  tcal: side = max( sqrt(a / tau), 1.25 b, 0.2 ) with the quantile-matched tau, second pass if side <= 0.8  (accepted method)
  box: side = max( margin b, 0.02 ), second pass if side <= 0.8  (plain crop of the predicted box; no area term)
variants:
  - {name: plain125, margin: 1.25, min_window: 0.02}
  - {name: plain150, margin: 1.5,  min_window: 0.02}
  - {name: plain200, margin: 2.0,  min_window: 0.02}
  - {name: plain300, margin: 3.0,  min_window: 0.02}
  - {name: plain400, margin: 4.0,  min_window: 0.02}
variant_notes:
  factors: 1.25, 1.5 and 2.0 are the factors of zoom_box_v1; 3.0 and 4.0 were added before any ultrasound result existed.
  geometry_note: >-
    for a compact prediction the area term of the rule equals about 3.0 b with tau = 0.086 (about 2.3 b on polyps),
    so that plain300 is expected to choose windows similar to the rule on ultrasound.
trigger: 0.8
zoom:        # constants of the accepted method; must equal the pilot protocol
  margin: 1.25
  min_window: 0.2
  zoom_in_if_window_at_most: 0.8
  zoom_out_if_fraction_at_least: 0.20
  zoom_out_target_fraction: 0.10
  max_window: 2.0
  fusion: second-pass map replaces the first inside the window; zero outside; first pass kept if the second is empty
reading_rules_fixed_in_advance:
  statistic: >-
    DSC of the rule minus DSC of the variant, percentage points; mean over the three seeds of paired image-level
    differences; macro mean over the four OOD sets, with a bootstrap interval and a sign-flip permutation test
  per_variant:
    rule_better: the difference is positive and its interval excludes zero
    variant_better: the difference is negative and its interval excludes zero
    not_distinguishable: otherwise
  transfer:
    supported: rule_better against plain200, the factor that was best on polyps
    not_supported: otherwise
  consequence: >-
    supported: the manuscript may state that a factor chosen on one dataset does not carry over while the rule does.
    not_supported: the manuscript states that a fixed factor of about two performed like the rule on both modalities,
    and does not present the transfer rule as an advantage in accuracy.
  note: descriptive; no configuration is selected from these results
disclosures:
  - The ultrasound test sets were used in earlier stages of this project.
  - BUID (35 images) and UDIAT (25 images) are small; the study has three seeds.
  - Only the detail-branch model is evaluated.
  - No factor was tuned; whether a factor outside this list does better is unknown.
statistics: {permutation_draws: 20000, bootstrap_draws: 10000, rng_seed: 20261012}
