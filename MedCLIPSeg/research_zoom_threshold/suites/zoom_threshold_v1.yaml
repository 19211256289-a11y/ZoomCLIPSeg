name: zoom_threshold_v1
locked_at: '2026-10-11'
purpose: >-
  Evaluation-only analysis requested by external reviews. The binarisation threshold of 0.5, inherited from the public
  code, enters SCZ three times: in the window rule (the predicted region), in the fallback when the second pass is empty,
  and in the final mask. Question: does the gain of SCZ over the single pass depend on this threshold? Nothing is
  trained and nothing here can change the method: the locked configuration with threshold 0.5 remains the method
  whatever the outcome, and the outcome is reported whatever it is.
locked_before: >-
  Written after zoom_budget_v1, retime_v1 and the formal controls had been accepted. No result at a threshold other
  than 0.5 existed for any model.
lineage:
  reports/acceptance_pilot_zoom_20261005/audit.json: 8bab68fe6d7bd821844dc0f2d842b9cf9cae93c65165f5ec51871c0aca0d21b3
  reports/acceptance_test_zoom_20261005/audit.json: 8212840dbfb2057411b584af8c661a7243aca29d68fd162a098b40d5cebdad17
mc_samples: 30
batch_size: 32
threshold: 0.5
reproduction_tolerance_pp: 0.25
sources:
  kvasir_v1: [666, 667, 668]
  formal_detail_mix_kvasir_v2: [669, 670]
arm: detail
accepted_two_pass:            # the accepted t15 results of these checkpoints (30 passes); read, not recomputed
  kvasir_v1: test_zoom_kvasir_v1
  formal_detail_mix_kvasir_v2: zoom_kvasir_seeds_v1
target_fraction: 0.15
thresholds: [0.3, 0.4, 0.5, 0.6, 0.7]
definitions:
  single_t: >-
    mean probability map of 30 stochastic passes of the whole image, computed exactly as in the accepted evaluation,
    binarised at t (single_t50 is the accepted single pass and serves as the reproduction check)
  scz_t: >-
    the locked two-pass rule with threshold t in the window rule, in the fallback (first prediction kept if the second
    map has no pixel above t) and in the final mask; the second run draws 30 new stochastic passes for every t
  t15: the locked method (threshold 0.5); read from the accepted results; scz_t50 must reproduce it within the tolerance
  metrics: DSC and NSD as in the accepted evaluation; Brier scores are not computed at shifted thresholds
zoom:        # constants of the accepted method; must equal the pilot protocol
  margin: 1.25
  min_window: 0.2
  zoom_in_if_window_at_most: 0.8
  zoom_out_if_fraction_at_least: 0.20
  zoom_out_target_fraction: 0.10
  max_window: 2.0
  fusion: second-pass map replaces the first inside the window; zero outside; first pass kept if the second is empty
reading_rules_fixed_in_advance:
  statistic: >-
    DSC difference in percentage points; mean over the five seeds of paired image-level differences; equal-weight macro
    mean over the four OOD sets, with a bootstrap interval (10 000 draws) and a sign-flip permutation test
  robust: >-
    The gain of SCZ is robust to the threshold if scz_t minus single_t (OOD mean) is positive with a 95% interval that
    excludes zero at every threshold in 0.3 to 0.7
  consequence: >-
    The manuscript reports the verdict and the gain at every threshold as they are. If the rule fails, it states at which
    thresholds the gain is not demonstrated. No threshold of this suite replaces 0.5 in the locked method.
disclosures:
  - The five polyp test sets were used in earlier stages of this project.
  - CVC-300 and CVC-ColonDB share 52 exact image hashes.
  - Only the detail-branch model is evaluated.
  - ETIS-Larib is not touched.
  - The thresholds share one first pass per image; the second pass is drawn anew for every threshold.
statistics: {permutation_draws: 20000, bootstrap_draws: 10000, rng_seed: 20261012}
