name: zoom_box_v2
locked_at: '2026-10-06'
purpose: >-
  Evaluation-only extension of zoom_box_v1 to larger fixed factors (2.5, 3.0 and 4.0 times the predicted box) on the
  same checkpoints and polyp test sets. zoom_box_v1 stopped at 2.0, where the gain was still rising. Question: does a
  larger fixed factor exceed the locked window rule, or does the rule sit near the best fixed factor? Nothing is trained;
  t15 remains the method whatever the outcome, and the outcome is reported whatever it is.
locked_before: >-
  Written after zoom_box_v1 had been accepted and while zoom_box_busi_v1 was running; no result with a factor above 2.0
  existed for any dataset.
lineage:
  reports/acceptance_pilot_zoom_20261005/audit.json: 8bab68fe6d7bd821844dc0f2d842b9cf9cae93c65165f5ec51871c0aca0d21b3
  reports/acceptance_test_zoom_20261005/audit.json: 8212840dbfb2057411b584af8c661a7243aca29d68fd162a098b40d5cebdad17
mc_samples: 30
batch_size: 32
threshold: 0.5
reproduction_tolerance_pp: 0.25
sources:
  kvasir_v1: [666, 667, 668]
  formal_detail_mix_kvasir_v2: [669, 670]
arm: detail
accepted_two_pass:            # the accepted t15 results of these checkpoints; they are read, not recomputed
  kvasir_v1: test_zoom_kvasir_v1
  formal_detail_mix_kvasir_v2: zoom_kvasir_seeds_v1
window_rules:
  t15: side = max( sqrt(a / 0.15), 1.25 b, 0.2 ), second pass if side <= 0.8  (accepted method; a = predicted area fraction, b = longer side of the predicted box)
  box: side = max( margin b, min_window ), second pass if side <= 0.8  (no area term)
variants:      # all cut the window from the original pixels around the centre of the predicted box, like t15
  - {name: plain250, margin: 2.5, min_window: 0.02}
  - {name: plain300, margin: 3.0, min_window: 0.02}
  - {name: plain400, margin: 4.0, min_window: 0.02}
variant_notes:
  plain: plain crop of the predicted box with a fixed factor; min_window 0.02 only prevents a degenerate window.
  earlier_factors: 1.25, 1.5 and 2.0 are reported in zoom_box_v1 and are not repeated here.
  trigger_note: >-
    with the common trigger (second pass if the window side is at most 0.8) a larger factor leaves more images without a
    second pass; this is part of what a fixed factor does and is reported.
trigger: 0.8
zoom:        # constants of the accepted method; must equal the pilot protocol
  margin: 1.25
  min_window: 0.2
  zoom_in_if_window_at_most: 0.8
  zoom_out_if_fraction_at_least: 0.20
  zoom_out_target_fraction: 0.10
  max_window: 2.0
  fusion: second-pass map replaces the first inside the window; zero outside; first pass kept if the second is empty
reading_rules_fixed_in_advance:
  statistic: >-
    DSC of t15 minus DSC of the variant, percentage points; mean over the five seeds of paired image-level
    differences; macro mean over the four OOD sets, with a bootstrap interval and a sign-flip permutation test
  per_variant:
    t15_better: the difference is positive and its interval excludes zero
    variant_better: the difference is negative and its interval excludes zero
    not_distinguishable: otherwise
  overall:
    fixed_factor_exceeds_rule: variant_better for at least one of the three factors
    rule_not_exceeded: otherwise
  consequence: >-
    fixed_factor_exceeds_rule: the manuscript states that the magnification chosen by the rule is not the best one on
    polyps and names the better factor. rule_not_exceeded: the manuscript may state that no fixed factor between 1.25
    and 4.0 exceeded the rule on polyps.
  note: descriptive; no configuration is selected from these results
disclosures:
  - The five polyp test sets were used in earlier stages of this project.
  - CVC-300 and CVC-ColonDB share 52 exact image hashes.
  - Only the detail-branch model is evaluated; the baseline is not.
  - ETIS-Larib is not touched.
  - The factors 2.5, 3.0 and 4.0 were fixed before any result of this suite existed; no factor was tuned.
statistics: {permutation_draws: 20000, bootstrap_draws: 10000, rng_seed: 20261013}
