evaluation_mc: 30
evaluation_conditions:
- generic
- original
primary_condition: generic
test_targets: []
automatic_test_after_all_training: false
paired_views: image_reflection_without_text_synchronization
primary_comparison: contrast_query_minus_baseline_and_global_query
screening_gate:
  overall_DSC_min_gain_pp: 1.0
  small_DSC_max_drop_pp: 0.5
  precision_max_drop_pp: 1.0
  zero_overlap_max_increase: 0
  over_global_query_DSC_min_gain_pp: 0.5
softcon_weight: 0.1
query_hidden: 64
pooling: sigmoid_coarse_logit_detached_normalized_foreground_background
query_output_initialization: zero
