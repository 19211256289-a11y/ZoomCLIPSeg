name: pilot_query_kvasir_v1
dataset: Kvasir
modes:
- baseline
- global_query
- contrast_query
seeds:
- 666
epochs: 30
percentage: 100
learning_rate: 0.0003
min_learning_rate: 0.0001
generic_prompt: a polyp in a colonoscopy image
initialization: unimedclip_base_fresh_adapters_and_head_per_seed
