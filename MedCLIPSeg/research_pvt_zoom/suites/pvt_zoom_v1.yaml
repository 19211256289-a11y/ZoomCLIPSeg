name: pvt_zoom_v1
locked_at: '2026-10-06'
purpose: >-
  Evaluation-only. The locked two-pass zoom (SCZ, configuration t15) is applied, unchanged, to the three Polyp-PVT
  models of polyp_pvt_kvasir_v1. Question: is the scale dependence that SCZ addresses specific to the frozen
  224 x 224 vision-language model, or does SCZ also help a dedicated network that was trained end to end at
  352 x 352 with multi-scale training? Nothing is trained; the outcome is reported whatever it is and changes neither
  the method nor the Polyp-PVT reference results.
locked_before: >-
  This protocol and its code were written after the single-pass results of seed 666 of polyp_pvt_kvasir_v1 had been
  inspected (a preview at the request of the first author) and before any two-pass result of any Polyp-PVT model existed.
source_suite: polyp_pvt_kvasir_v1
seeds: [666, 667, 668]
input_size: 352
threshold: 0.5
reproduction_tolerance_pp: 0.05
procedure:
  first_pass: the accepted Polyp-PVT inference (352 x 352 input, sum of both outputs, sigmoid)
  localisation: area fraction and bounding box of the first prediction at threshold 0.5 on the 352 x 352 output grid
  window: the accepted rule of research_zoom.geometry with the constants below; never zooms out
  second_pass: the window is cut from the original pixels, resized to 352 x 352 and segmented by the same model
  fusion: second-pass map replaces the first inside the window; zero outside; first pass kept if the second is empty
target_fraction: 0.15     # t15; the training masks are the same Kvasir-SEG masks as for our models
zoom:        # constants of the accepted method; must equal the pilot protocol
  margin: 1.25
  min_window: 0.2
  zoom_in_if_window_at_most: 0.8
  zoom_out_if_fraction_at_least: 0.20
  zoom_out_target_fraction: 0.10
  max_window: 2.0
  fusion: second-pass map replaces the first inside the window; zero outside; first pass kept if the second is empty
strata_percent: [1, 3, 5.9, 15]      # lesion area as a share of the image; the strata of the manuscript
reading_rules_fixed_in_advance:
  statistic: >-
    two-pass minus single-pass DSC, percentage points; mean over the three seeds of paired image-level differences;
    macro mean over the four OOD sets with a bootstrap interval and a sign-flip permutation test; the same for ETIS-Larib
  scz_transfers: the macro OOD gain is positive, its interval excludes zero and it is positive for each seed
  scz_harms: the macro OOD gain is negative and its interval excludes zero
  no_effect: otherwise
  consequence: >-
    scz_transfers: SCZ is reported as a test-time procedure that also helps a dedicated network.
    no_effect or scz_harms: the manuscript states that the scale dependence addressed by SCZ is specific to the frozen
    224 x 224 model and that a network with multi-scale training does not benefit.
disclosures:
  - The five polyp test sets were used in earlier stages of this project.
  - ETIS-Larib is evaluated here once for the combination of Polyp-PVT with SCZ; the evaluation of our own method on it stays closed.
  - CVC-300 and CVC-ColonDB share 52 exact image hashes.
  - No constant of SCZ is adapted to Polyp-PVT; in particular the target fraction is not tuned.
statistics: {permutation_draws: 20000, bootstrap_draws: 10000, rng_seed: 20261011}
