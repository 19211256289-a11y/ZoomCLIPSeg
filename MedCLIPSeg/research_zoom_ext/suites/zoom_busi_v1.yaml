name: zoom_busi_v1
locked_at: '2026-10-05'
purpose: >-
  Replication on a second dataset and modality. Two-pass zoom applied to the BUSI checkpoints of
  formal_detail_mix_busi_v1 (three arms, three seeds). Locked while those checkpoints were still training
  and before any BUSI Test result existed. Evaluation only; nothing is selected or tuned on BUSI.
source: formal_detail_mix_busi_v1
arms: [baseline, detail, detail_global_mix]
seeds: [666, 667, 668]
lineage:
  reports/acceptance_pilot_zoom_20261005/audit.json: 8bab68fe6d7bd821844dc0f2d842b9cf9cae93c65165f5ec51871c0aca0d21b3
  reports/acceptance_test_zoom_20261005/audit.json: 8212840dbfb2057411b584af8c661a7243aca29d68fd162a098b40d5cebdad17
configs:
  - {name: tcal, target_fraction: source_calibrated, zoom_out: false, oracle: false}
  - {name: t15, target_fraction: 0.15, zoom_out: false, oracle: false}
primary_config: tcal
source_calibration:
  rule: >-
    The target fraction is a property of the source training set. q is the share of Kvasir Train lesions whose
    area fraction is at most 0.15 (the value selected on Kvasir). The calibrated target for another source is the
    q-quantile of its own Train lesion area fractions. On Kvasir this rule returns 0.15 by construction.
  reference_dataset: Kvasir
  reference_fraction: 0.15
  why_primary: >-
    BUSI Train lesions are smaller relative to the image than Kvasir Train lesions (25th percentile 2.2% versus 5.9%),
    so the fixed value 0.15 would enlarge most lesions beyond the scale the BUSI model was trained on. The rule is
    computed from Train masks only, at lock time, before any evaluation. The fixed value is reported as secondary.
zoom:
  margin: 1.25
  min_window: 0.2
  zoom_in_if_window_at_most: 0.8
  zoom_out_if_fraction_at_least: 0.20
  zoom_out_target_fraction: 0.10
  max_window: 2.0
  fusion: second-pass map replaces the first inside the window; zero outside; first pass kept if the second is empty
single_pass_reproduction_tolerance_pp: 0.1
gate:
  description: >-
    Fixed before any BUSI Test result existed. Primary config on the primary arm; two-pass minus single-pass,
    three-seed mean of DSC differences in percentage points.
  primary_arm: detail
  g1_macro_ood_dsc_gain_at_least_pp: 0.5
  g2_min_ood_sets_with_positive_gain: 3
  g3_source_test_dsc_change_at_least_pp: -0.2
  g4_max_dsc_regression_any_set_pp: 0.5
  g5_all_seeds_positive_on_macro_ood: true
  threshold_note: >-
    g1 is +0.5 rather than the +1.0 used on Kvasir because no error analysis of the ultrasound test sets was
    available to predict the size of the effect; +0.5 is the smallest gain treated as meaningful in this project.
  if_fail: reported as not replicated on BUSI; the method is then described as validated on polyp data only
known_property: >-
  On images without a lesion the two-pass result equals the single-pass result (an empty first pass is never zoomed;
  an empty second pass keeps the first), so normal-image false positives are neither added nor removed.
disclosures:
  - BUID (35 images) and UDIAT (25 images) are small; their per-set gains are noisy.
  - The method and its fixed parameters were developed on polyp data.
statistics: {permutation_draws: 100000, bootstrap_draws: 10000, rng_seed: 20261005}
