name: zoom_kvasir_seeds_v1
locked_at: '2026-10-05'
purpose: >-
  The locked two-pass zoom configuration applied to the new Kvasir seeds 669 and 670 (all four arms)
  of formal_detail_mix_kvasir_v2, so that every row of the main table has five seeds. Evaluation only.
source: formal_detail_mix_kvasir_v2
arms: [baseline, global_mix, detail, detail_global_mix]
seeds: [669, 670]
lineage:
  reports/acceptance_pilot_zoom_20261005/audit.json: 8bab68fe6d7bd821844dc0f2d842b9cf9cae93c65165f5ec51871c0aca0d21b3
  reports/acceptance_test_zoom_20261005/audit.json: 8212840dbfb2057411b584af8c661a7243aca29d68fd162a098b40d5cebdad17
configs:
  - {name: t15, target_fraction: 0.15, zoom_out: false, oracle: false}
primary_config: t15
zoom:
  margin: 1.25
  min_window: 0.2
  zoom_in_if_window_at_most: 0.8
  zoom_out_if_fraction_at_least: 0.20
  zoom_out_target_fraction: 0.10
  max_window: 2.0
  fusion: second-pass map replaces the first inside the window; zero outside; first pass kept if the second is empty
single_pass_reproduction_tolerance_pp: 0.25
tolerance_note: the accepted single-pass results of these checkpoints were computed on the training server, not on this PC
gate:
  description: >-
    Fixed before any two-pass number of these checkpoints was computed. Consistency check on new seeds;
    two-pass minus single-pass, mean over the two seeds of DSC differences in percentage points.
  primary_arm: detail
  g1_macro_ood_dsc_gain_at_least_pp: 1.0
  g2_min_ood_sets_with_positive_gain: 3
  g3_source_test_dsc_change_at_least_pp: -0.2
  g4_max_dsc_regression_any_set_pp: 0.5
  g5_all_seeds_positive_on_macro_ood: true
disclosures:
  - Same test sets as the three-seed confirmation; this checks new training seeds, not new data.
statistics: {permutation_draws: 100000, bootstrap_draws: 10000, rng_seed: 20261005}
