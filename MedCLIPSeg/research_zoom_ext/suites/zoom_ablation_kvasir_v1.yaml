name: zoom_ablation_kvasir_v1
locked_at: '2026-10-05'
purpose: >-
  Ablation. The two-pass zoom configuration confirmed on the detail arm (test_zoom_kvasir_v1) is applied,
  unchanged, to the other three accepted Kvasir arms. Evaluation only; nothing is selected or tuned.
source: kvasir_v1
arms: [baseline, global_mix, detail_global_mix]
seeds: [666, 667, 668]
lineage:
  reports/acceptance_pilot_zoom_20261005/audit.json: 8bab68fe6d7bd821844dc0f2d842b9cf9cae93c65165f5ec51871c0aca0d21b3
  reports/acceptance_test_zoom_20261005/audit.json: 8212840dbfb2057411b584af8c661a7243aca29d68fd162a098b40d5cebdad17
configs:
  - {name: t15, target_fraction: 0.15, zoom_out: false, oracle: false}
primary_config: t15
zoom:
  margin: 1.25
  min_window: 0.2
  zoom_in_if_window_at_most: 0.8
  zoom_out_if_fraction_at_least: 0.20
  zoom_out_target_fraction: 0.10
  max_window: 2.0
  fusion: second-pass map replaces the first inside the window; zero outside; first pass kept if the second is empty
single_pass_reproduction_tolerance_pp: 0.1
gate: null
interpretation_fixed_in_advance:
  - Descriptive only. The detail-arm numbers come from test_zoom_kvasir_v1 and are not recomputed here.
  - The final-model rule of formal_detail_mix_kvasir_v2 is unchanged; no arm is chosen because of its two-pass score.
disclosures:
  - The size-prior weakness that motivated the method was quantified on Test/OOD predictions of these checkpoints.
  - The five test sets were used before; ColonDB and CVC300 share 52 exact image hashes.
statistics: {permutation_draws: 100000, bootstrap_draws: 10000, rng_seed: 20261005}
