name: lowdata_kvasir_v1
locked_at: '2026-10-06'
purpose: >-
  Requested by external reviews: with the full training set a dedicated polyp network is clearly more accurate than
  our models (polyp_pvt_kvasir_v1). Data efficiency is the main argument made for frozen vision-language
  segmentation models. This suite trains our fixed-sentence baseline and the detail-branch model on the 10% and 25%
  subsets of the Kvasir-SEG training split that are distributed with MedCLIPSeg, with the accepted training recipe
  unchanged, and evaluates them with single-pass inference and with the locked SCZ on the five polyp test sets. The
  reference network trained on the same subsets is part of pvt_ext_v1. The results are reported whatever they are.
locked_before: >-
  Written after polyp_pvt_kvasir_v1 had been accepted; no fixed-sentence model and no Polyp-PVT model trained on a
  reduced training set had been evaluated on any test set.
dataset: Kvasir
fractions: [10, 25]
seeds: [666, 667, 668]
epochs: 100
prompt: a polyp in a colonoscopy image
arms:
  baseline: {query_mode: baseline}
  detail:   {query_mode: detail}
recipe: accepted recipe of formal_detail_mix_kvasir_v1 (paired reflection, corrected Dice), unchanged; only the training list differs
training_lists: Train_text_10.xlsx and Train_text_25.xlsx as distributed with MedCLIPSeg (the validation lists of the same fraction are read by the trainer but select nothing)
training_images: {p10: 80, p25: 200}        # of the 800 images of the full training list; verified before training
validation_images: {p10: 10, p25: 25}
checkpoint: final_epoch_100_latest
mc_samples: 30
batch_size: 32
threshold: 0.5
small_target_threshold: 0.058989688326573426
test_list: Test_text_original.xlsx
test_targets: [Kvasir, ColonDB, ClinicDB, CVC300, BKAI]
ood_targets: [ColonDB, ClinicDB, CVC300, BKAI]
two_pass:
  source: test_zoom_kvasir_v1 (configuration t15, unchanged; target fraction 0.15 as for the full training set)
  acceptance_audit: reports/acceptance_test_zoom_20261005/audit.json
  acceptance_sha256: 8212840dbfb2057411b584af8c661a7243aca29d68fd162a098b40d5cebdad17
reference:
  low_data: pvt_ext_v1 (groups kvasir_p10 and kvasir_p25), read when available
  full_data:      # accepted three-seed results of the same seeds, for the rows at 100%; read, not recomputed
    baseline:     [test_detail_mix_kvasir_v1, baseline, null]
    baseline_scz: [zoom_ablation_kvasir_v1, baseline, t15]
    detail:       [test_zoom_kvasir_v1, detail, single]
    full:         [test_zoom_kvasir_v1, detail, t15]
    pvt: polyp_pvt_kvasir_v1
reading_rules_fixed_in_advance:
  statistic: >-
    DSC difference in percentage points; mean over the three seeds of paired image-level differences; macro mean over the
    four OOD sets, with a bootstrap interval and a sign-flip permutation test
  frozen_framework_ahead: at a fraction, our full method minus Polyp-PVT is positive with an interval that excludes zero
  dedicated_network_ahead: at a fraction, the same difference is negative with an interval that excludes zero
  gap_narrows: the advantage of Polyp-PVT over our full method at 10% is at least 1 pp smaller than with the full training set
  consequence: >-
    The manuscript reports the three operating points (10%, 25%, 100%) for the baseline, the full method and Polyp-PVT as
    measured. It claims an advantage of the frozen framework for small training sets only if frozen_framework_ahead holds
    at 10%, and then subject to the conditional follow-up of pvt_ext_v1. Where dedicated_network_ahead holds it says so;
    where neither rule holds it states that the two were not separated at that training-set size.
disclosures:
  - The five polyp test sets were used in earlier stages of this project; ETIS-Larib is not used here.
  - The target fraction of SCZ (0.15) was derived from the full training set and is not re-derived for the subsets.
  - With a reduced training set every model makes proportionally fewer optimisation steps (the number of epochs is kept).
  - Three seeds vary the initialisation and the order of the training samples; the subset itself is fixed.
  - The 10% list is not a subset of the 25% list; both are subsets of the full training list.
  - Our models and Polyp-PVT are compared at equal training images, not at equal optimisation steps or training time.
statistics: {permutation_draws: 20000, bootstrap_draws: 10000, rng_seed: 20261016}
